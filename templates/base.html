<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stay Manager</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    input, button { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; font-size: 16px; }
    button { background: #2563eb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    .msg { background: #fef3c7; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
    nav { display: flex; justify-content: space-between; margin-bottom: 20px; }
  </style>
</head>
<body>
  <nav>
    <strong>Stay Manager</strong>
    {% if session.user_id %}<a href="{{ url_for('logout') }}">Logout</a>{% endif %}
  </nav>
  {% for m in get_flashed_messages() %}<div class="msg">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
